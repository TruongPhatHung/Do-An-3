spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db
    username: postgres
    password: 12345 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo và cập nhật bảng trong DBeaver dựa trên Entity
    show-sql: true # Hiển thị câu lệnh SQL ở màn hình console để bạn dễ theo dõi
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect